<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Shithead</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f5132;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:20px}
.box{max-width:520px;width:100%;background:rgba(0,0,0,.18);padding:20px;border-radius:16px}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 16px;background:#ffd166;color:#29220d}
#status{margin-top:14px;color:#d7e6de}
</style>
</head>
<body>
<div class="box">
<h1>Reset Shithead</h1>
<p>This removes old offline versions cached by your browser.</p>
<button id="resetBtn">Clear old game & reload</button>
<div id="status"></div>
</div>
<script>
document.getElementById('resetBtn').addEventListener('click', async () => {
  const status=document.getElementById('status');
  status.textContent='Clearing old service workers and caches…';
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    status.textContent='Cleared. Reloading clean game…';
    setTimeout(()=>location.href='./single.html?clean=21&ts='+Date.now(),500);
  }catch(e){
    status.textContent='Reset error: '+e.message;
  }
});
</script>
</body>
</html>
