<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Shithead</title>
<meta name="theme-color" content="#0f5132" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Shithead" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
body{
  min-height:100vh;
  padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);
  color:white;
  background:linear-gradient(#0f5132,#0b3d28);
  display:flex;
  align-items:center;
  justify-content:center;
}
.wrap{width:100%;max-width:520px}
.logo{font-size:42px;font-weight:950;margin:0 0 6px}
.sub{color:#d7e6de;margin-bottom:24px}
.mode{
  display:block;
  text-decoration:none;
  color:white;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.14);
  border-radius:18px;
  padding:18px;
  margin:12px 0;
}
.mode h2{margin:0 0 5px;font-size:24px}
.mode p{margin:0;color:#d7e6de}
.mode.primary{background:#ffd166;color:#29220d}
.mode.primary p{color:#5b4b18}
.note{font-size:13px;color:#d7e6de;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Shithead</div>
  <div class="sub">Choose how you want to play.</div>

  <a class="mode primary" href="single.html">
    <h2>Single Player</h2>
    <p>Play against computer opponents.</p>
  </a>

  <a class="mode" href="multiplayer.html?v=13-debug">
    <h2>Multiplayer</h2>
    <p>Host a room or join friends with a room code.</p>
  </a>

  <div class="note">Multiplayer requires an internet connection. Single player can work offline after the app has been loaded once.</div>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>
